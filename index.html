  <script>
    const charsFixed = [
      " ", ".", ":", "-", "=", "+", "*", "#", "%", "@",
      "1", "2", "3", "4", "5", "6", "9", "0", "X", "W"

    const audio = document.getElementById('audio');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    canvas.width = 150;

    let isPlaying = false;
    let animId = null;
    let startTime = 0;

    // 100% Same-Origin Native 2D Canvas Procedural Scenes (NEVER TAINTED, ZERO CORS ERROR!)
    function renderProceduralScene(ctx, w, h, t) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      if (t < 4.5) {
        // Intro beat
        ctx.fillStyle = '#1a1a24';
        ctx.font = 'bold 7px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('LIVE SERVER RUNNING...', w / 2, h / 2 - 8);

        const bars = 18;
        const bW = 4;
        const sp = 2;
        const stX = (w - (bars * (bW + sp))) / 2;
        for (let i = 0; i < bars; i++) {
          const freq = Math.sin(t * 8 + i * 0.5) * 0.5 + 0.5;
          const bH = freq * (h * 0.35);
          ctx.fillStyle = i % 2 === 0 ? '#00e5ff' : '#ffffff';
          ctx.fillRect(stX + i * (bW + sp), h / 2 + 10 - bH / 2, bW, bH);
        }
      } else if (t < 9.5) {
        //  Heyyow Bayu
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.fillStyle = '#ffea00';
        ctx.font = '900 17px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('HEYYOOWW', 0, -8);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 17px monospace';
        ctx.fillText('TIM A  ', 0, 8);
        ctx.restore();
      } else if (t < 14.2) {
        // Pesan terbuka untuk kalian
        const p = 1 + Math.max(0, Math.sin((t - 9.5) * 6)) * 0.1;
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.scale(p, p);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 17px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('All Night For', 0, -8);
        ctx.fillText('This', 0, 9);
        ctx.restore();
      } else if (t < 18.8) {
        // Minimal Pk host dekk
        const p = 1 + Math.max(0, Math.sin((t - 14.2) * 6)) * 0.1;
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.scale(p, p);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 17px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('All Year For', 0, -8);
        ctx.fillText('This', 0, 9);
        ctx.restore();
      } else if (t < 26.5) {
        // FROM TEAM C (3D ribbon cylinder)
        const rel = t - 18.8;
        const midY = h / 2;
        const rH = 34;
        ctx.fillStyle = '#f8f0ea';
        ctx.beginPath();
        ctx.moveTo(0, midY - rH / 2);
        for (let x = 0; x <= w; x += 4) {
          const wv = Math.sin((x / w) * Math.PI * 3 + rel * 2.5) * 5;
          ctx.lineTo(x, midY - rH / 2 + wv);
        }
        for (let x = w; x >= 0; x -= 4) {
          const wv = Math.sin((x / w) * Math.PI * 3 + rel * 2.5) * 5;
          ctx.lineTo(x, midY + rH / 2 + wv);
        }
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = '900 20px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FOR YOU', w / 2, midY);
      } else if (t < 33.0) {
        // Cinderella Carriage & Galloping Horses
        const rel = t - 26.5;
        ctx.fillStyle = '#ffea00';
        ctx.font = 'bold 17px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Cinderella', w / 2, 14);

        const scX = (rel * 14) % (w + 40);
        const bY = h * 0.72;
        const hX = 20 + scX * 0.3;
        ctx.fillStyle = '#e6e6e6';
        ctx.fillRect(hX, bY - 12, 22, 10);
        ctx.fillRect(hX + 16, bY - 20, 8, 12);
        const lSw = Math.sin(rel * 15) * 4;
        ctx.fillRect(hX + 2, bY - 2, 3, 10 + lSw);
        ctx.fillRect(hX + 16, bY - 2, 3, 10 - lSw);

        const cX = hX + 50;
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.arc(cX + 16, bY - 8, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff0077';
        ctx.beginPath();
        ctx.arc(cX + 16, bY - 9, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cX + 6, bY + 6, 6, 0, Math.PI * 2);
        ctx.arc(cX + 26, bY + 6, 6, 0, Math.PI * 2);
        ctx.stroke();
      } else if (t < 37.2) {
        // Man, I Swear
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 17px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Man, I ', w / 2 - 24, h / 2);
        ctx.fillStyle = '#ffea00';
        ctx.fillText('Swear', w / 2 + 30, h / 2);
      } else if (t < 41.5) {
        // You Ain't Gotta Be
        ctx.font = 'bold 15px monospace';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ff00aa';
        ctx.textAlign = 'right';
        ctx.fillText('You ', w / 2 - 2, h / 2 - 8);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.fillText("Ain't", w / 2 + 4, h / 2 - 8);
        ctx.textAlign = 'center';
        ctx.fillText('Gotta Be', w / 2, h / 2 + 10);
      } else if (t < 45.0) {
        // Come W Me (Creation of Adam hands)
        const rel = t - 41.5;
        const off = Math.sin(rel * 3) * 4;
        ctx.fillStyle = '#ffddaa';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.65);
        ctx.lineTo(w * 0.42 + off, h * 0.58);
        ctx.lineTo(w * 0.38 + off, h * 0.52);
        ctx.lineTo(0, h * 0.45);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(w, h * 0.45);
        ctx.lineTo(w * 0.58 - off, h * 0.52);
        ctx.lineTo(w * 0.62 - off, h * 0.58);
        ctx.lineTo(w, h * 0.68);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffea00';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Come W Me', w / 2, h / 2 - 12);
      } else if (t < 48.0) {
        // ROOM (Sliding elevator doors closing)
        const rel = t - 45.0;
        const dW = (w * 0.34) * Math.min(1, rel / 2.2);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 18px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ROOM', w / 2, h / 2);
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(0, 0, dW, h);
        ctx.fillRect(w - dW, 0, dW, h);
      } else {
        // Midnight Clock 12:00
        const rel = t - 48.0;
        const rad = Math.min(w, h) * 0.38;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, rad, 0, Math.PI * 2);
        ctx.stroke();

        const mAng = rel * 3.5 * Math.PI * 2;
        ctx.strokeStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(w / 2, h / 2);
        ctx.lineTo(w / 2 + Math.sin(mAng) * rad * 0.75, h / 2 - Math.cos(mAng) * rad * 0.75);
        ctx.stroke();

        const hAng = (11 / 12) * Math.PI * 2 + rel * 0.2;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w / 2, h / 2);
        ctx.lineTo(w / 2 + Math.sin(hAng) * rad * 0.5, h / 2 - Math.cos(hAng) * rad * 0.5);
        ctx.stroke();
      }
    }

    const updateCanvas = () => {
      if (!isPlaying) return;
      const w = canvas.width;
      const h = canvas.height;

      let currT = 0;
      if (audio && !audio.paused && audio.currentTime > 0) {
        currT = audio.currentTime;
      } else {
        currT = ((performance.now() - startTime) / 1000) + elapsedPaused;
      }

      if (currT > 50.8) {
        if (audio) audio.currentTime = 0;
        startTime = performance.now();
        elapsedPaused = 0;
        currT = 0;
      }

      // Pure Same-Origin Native Rendering (NEVER TAINTED!)
      renderProceduralScene(ctx, w, h, currT);

      let imgData;
      try {
        imgData = ctx.getImageData(0, 0, w, h);
      } catch (err) {
        console.error('Canvas read error:', err);
        animId = requestAnimationFrame(updateCanvas);
        return;
      }

      const data = imgData.data;
      let output = "";

      for (let y = 0; y < h; y += 2) {
        let row = "";
        for (let x = 0; x < w; x += 1) {
          const i = (y * w + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

          if (brightness < 20) {
            row += " ";
          } else {
            const charIdx = Math.floor((brightness / 255) * (charsLength - 1));
            const char = chars[charIdx] || chars[0];
            row += `<span style="color:rgb(${r},${g},${b})">${char}</span>`;
          }
        }
        output += row + "\n";
      }

      outputText.innerHTML = output;
      animId = requestAnimationFrame(updateCanvas);
    };

    const togglePlay = () => {
      if (isPlaying) {
        try { if (audio) audio.pause(); } catch(e){}
        isPlaying = false;
        if (animId) cancelAnimationFrame(animId);
        elapsedPaused += (performance.now() - startTime) / 1000;
        hint.textContent = "▶ Klik untuk Melanjutkan";
        hint.style.opacity = "1";
      } else {
        isPlaying = true;
        startTime = performance.now();

        if (audio) {
          try {
            audio.play().catch(e => console.log('Audio autoplay prevented:', e));
          } catch(e){}
        }

        animId = requestAnimationFrame(updateCanvas);
        hint.style.opacity = "0";
      }
    };

    document.body.addEventListener('click', togglePlay);
  </script>
</body>
</html>
